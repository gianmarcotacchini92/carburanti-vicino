services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${DOMAIN:?Imposta DOMAIN nel file .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?Imposta VAPID_SUBJECT nel file .env}
      TRUST_PROXY: "1"
    volumes:
      - pieno-data:/app/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Imposta DOMAIN nel file .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
volumes:
  pieno-data:
  caddy-data:
  caddy-config:
